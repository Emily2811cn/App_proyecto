<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Tareas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="blob blob-one" aria-hidden="true"></div>
  <div class="blob blob-two" aria-hidden="true"></div>

  <main class="container">
    <header class="page-header">
      <span class="eyebrow">✿ ORGANIZACIÓN DE MIS TAREAS - EMILY ✿</span>
      <h1>Mis Tareas</h1>
      <p class="subtitle">Tareas que tengo pendientes</p>
    </header>

    <form id="task-form" class="task-form">
      <input type="text" id="title-input" placeholder="¿Qué tienes que hacer?" required>
      <input type="text" id="description-input" placeholder="Añade un detalle (opcional)">
      <button type="submit">
        <span>Agregar tarea</span>
      </button>
    </form>

    <div class="filter-wrap">
      <span class="filter-icon" aria-hidden="true">⌕</span>
      <input type="text" id="filter-input" class="filter-input" placeholder="Buscar entre tus tareas...">
    </div>

    <ul id="task-list" class="task-list"></ul>

    <p id="empty-message" class="empty-message" hidden>✨ No hay tareas que coincidan. ¡Prueba con otra palabra!</p>
  </main>

  <div id="task-modal" class="modal-overlay" hidden>
    <div class="modal">
      <button id="modal-close" class="modal-close" aria-label="Cerrar">✕</button>
      <h2 id="modal-title"></h2>
      <p id="modal-description" class="modal-description"></p>

      <h3 class="modal-subheading">Línea de tiempo</h3>
      <ul id="modal-timeline" class="timeline"></ul>
      <p id="modal-timeline-empty" class="empty-message" hidden>Aún no hay avances registrados.</p>

      <form id="update-form" class="update-form">
        <input type="text" id="update-input" placeholder="¿Qué hiciste o falta por hacer?" required>
        <button type="submit">Agregar avance</button>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
